[package]
name = "bitcoind"
version = "1.0.0"
description = "Stateless Transaction Indexing Engine for Bitcoin"
license = "GPL-3.0"
edition = "2021"

[dependencies]
config = { path = "../config" }
serde = { version = "1", features = ["rc"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
serde-hex = "0.1.0"
serde_derive = "1"
hiro-system-kit = { workspace = true }
rocket = { version = "=0.5.0", features = ["json"] }
bitcoin = { workspace = true }
bitcoincore-rpc = "0.19.0"
bitcoincore-rpc-json = "0.19.0"
# bitcoincore-rpc 0.19 only enables jsonrpc's `minreq_http` feature, but minreq's
# auth handling is unreliable against bitcoind's RPC. Enable `simple_http` here
# (the same hand-written HTTP/1.0 transport that worked in jsonrpc 0.14, used by
# 0.18) and construct the Client manually via from_jsonrpc(). See SKRYBITDEV-588.
jsonrpc = { version = "0.18", features = ["simple_http"] }
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
tokio = { workspace = true }
base58 = "0.2.0"
crossbeam-channel = "0.5.15"
hex = "0.4.3"
zmq = "0.10.0"
lazy_static = "1.4.0"
schemars = { version = "0.8.16", git = "https://github.com/hirosystems/schemars.git", branch = "feat-chainhook-fixes" }
strum = { version = "0.23.0", features = ["derive"] }
dhat = { version = "0.3.3", optional = true }

[dev-dependencies]
assert-json-diff = "2.0.2"
test-case = "3.1.0"

[features]
default = ["hiro-system-kit/log"]
debug = ["hiro-system-kit/debug"]
release = ["hiro-system-kit/release_debug", "hiro-system-kit/full_log_level_prefix"]
dhat-heap = ["dhat"]
